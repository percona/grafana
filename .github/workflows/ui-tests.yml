---
name: UI Tests
on:
  pull_request:

jobs:
  test:
    name: Run UI tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    timeout-minutes: 50

    steps:
      - name: Checkout Grafana code
        uses: actions/checkout@v6
        with:
          path: ./grafana

      - name: Run with Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
          cache-dependency-path: ./grafana/yarn.lock

      - name: Install dependencies for Grafana
        working-directory: ./grafana
        run: YARN_CHECKSUM_BEHAVIOR=update yarn install --immutable

      - name: Start Environment
        working-directory: ./grafana
        run: make run-local-env

      - name: Checkout pmm-qa in ${{ github.head_ref }} branch
        uses: actions/checkout@v6
        continue-on-error: true
        id: branch_checkout
        with:
          token: ${{ secrets.ROBOT_TOKEN }}
          ref: ${{ github.head_ref }}
          repository: percona/pmm-qa
          path: ./pmm-qa

      - name: Checkout pmm-qa in ${{ github.base_ref }} branch
        uses: actions/checkout@v6
        if: ${{ steps.branch_checkout.outcome != 'success' }}
        continue-on-error: true
        id: target_branch_checkout
        with:
          token: ${{ secrets.ROBOT_TOKEN }}
          ref: ${{ github.base_ref }}
          repository: percona/pmm-qa
          path: ./pmm-qa

      - name: Checkout pmm-qa in main branch
        uses: actions/checkout@v6
        if: ${{ steps.branch_checkout.outcome != 'success' && steps.target_branch_checkout.outcome != 'success'  }}
        with:
          token: ${{ secrets.ROBOT_TOKEN }}
          ref: main
          repository: percona/pmm-qa
          path: ./pmm-qa

      - name: Install Playwright dependencies for UI tests
        working-directory: ./pmm-qa/e2e_tests
        run: npm install

      - name: install playwright (e2e_tests)
        working-directory: ./pmm-qa/e2e_tests
        run: npx playwright install

      - name: Run Playwright UI tests
        working-directory: ./pmm-qa/e2e_tests
        run: npx playwright test --grep @grafana-pr

      - name: Attaching Playwright artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-ui-tests-output
          path: |
            ./pmm-qa/e2e_tests/playwright-report
            ./pmm-qa/e2e_tests/output
            ./pmm-qa/e2e_tests/test-results
